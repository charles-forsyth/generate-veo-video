[project]
name = "generate-veo-video"
version = "0.4.0"
description = "A CLI tool for generating videos using Google Gemini Omni Flash (Interactions API)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Charles Forsyth", email = "charles.forsyth@example.com"}
]
dependencies = [
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
generate-veo = "generate_veo3_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
